name: battery-health-center
title: Battery Health Center
base: core24
version: '0.4.1'
summary: Battery health, charge limits and app energy usage in one place
description: |
  Battery Health Center brings everything about your laptop battery together
  in one native GNOME app, much like the Battery settings on macOS. Available
  in English, Spanish and German.

  This is the sandboxed edition. The full version, with real app icons, the
  power-mode and power-saving controls and battery-saving tips, is in the apt
  repository: https://arios4k.github.io/apt

  **Overview**
  - Charge level, status and time remaining (until empty, or until your charge limit)
  - Live power draw in watts, and your charger's type and wattage
  - Since last charge: when you unplugged, battery used and average power draw
  - A quick health summary: maximum capacity, condition and cycle count
  - Battery levels of wireless mice, keyboards and headphones
  - Recommendations: limit charging, a weak charger, high drain during sleep, a power-hungry app

  **Battery health**
  - Maximum capacity compared with when the battery was new
  - Condition: Normal, Worn or Service Recommended
  - Full-charge and design capacity, capacity lost, cycle count, voltage,
    manufacturer, model, chemistry and serial number
  - Capacity over time, with a trend and a projected date for 80% after
    about two weeks
  - Guided calibration (charge, use until nearly empty, charge again) for when
    the percentage jumps or the laptop shuts down early
  - Laptops with two batteries are supported

  **Charging**
  Lithium batteries wear faster when kept at 100%. If your laptop is plugged in
  most of the time, limiting the charge to about 80% can noticeably extend the
  battery's lifespan.
  - Profiles: Maximum Lifespan (60%), Balanced (80%) or Full Capacity (100%),
    or set where charging stops and resumes. The limit is kept after restarts
    and sleep
  - "Charge to 100% Now" charges fully once, for a trip, then your limit comes
    back by itself
  - Charging schedule: charge to 100% just before the times you choose (for
    example weekdays at 07:30) and keep your limit the rest of the time
  - Optimized charging: learns when you usually unplug and charges to 100%
    just before

  **Power**
  - Show the battery percentage in the top bar
  - Power mode, automatic power mode and GNOME's power-saving settings (dim,
    screen blank, suspend, power button, lid) are only in the full version:
    this sandbox blocks them

  **Usage**
  - Battery level and power draw for the last 24 hours or 7 days
  - Battery use during sleep, with a warning when it's unusually high, and
    which sleep mode your laptop uses
  - Apps using significant energy right now, and which used the most since
    the app opened or over the last 24 hours or 7 days, with estimated energy
    used on battery. Click an app to see its energy use hour by hour
  - Optional background recording (starts hidden at login) keeps history and
    notifications working with the window closed

  **Notifications**
  Charge limit reached, fully charged without a limit, low battery, an app
  draining the battery, high drain during sleep and each calibration step.
  Turn them off in Preferences.

  **Reports and data**
  Export an HTML report with battery details, capacity history, recent usage,
  sleep drain and top apps, for warranty claims or your records. Or export the
  history as CSV files for a spreadsheet.

  **Permissions**
  This snap is strictly confined. After installing, connect these interfaces:

      sudo snap connect battery-health-center:hardware-observe
      sudo snap connect battery-health-center:system-observe
      sudo snap connect battery-health-center:power-control

  hardware-observe reads battery information, system-observe sees which apps
  use energy, and power-control changes the charge limit. The app shows which
  ones are missing. Wireless device batteries use upower-observe, which
  connects by itself.

  **Compatibility**
  Battery information works on any laptop with a standard Linux battery driver.
  Charge limits need firmware support exposed by the kernel
  (charge_start/stop_threshold), as on ThinkPads and many other laptops.
  Charger wattage needs a USB-C charger that reports it.

  Linux doesn't measure power per app, so app energy usage is an estimate
  based on CPU time.
grade: stable
confinement: strict
license: GPL-3.0-or-later
website: https://github.com/arios4k/battery-health-center
source-code: https://github.com/arios4k/battery-health-center
issues: https://github.com/arios4k/battery-health-center/issues
contact: https://github.com/arios4k/battery-health-center/issues
icon: data/icons/hicolor/scalable/apps/io.github.BatteryHealthCenter.svg

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  battery-health-center:
    command: bin/battery-health-center
    desktop: usr/share/applications/io.github.BatteryHealthCenter.desktop
    common-id: io.github.BatteryHealthCenter
    autostart: io.github.BatteryHealthCenter.desktop
    extensions: [gnome]
    plugs:
      - hardware-observe
      - system-observe
      - upower-observe # wireless device batteries (auto-connected)

  # Root service that applies charge limits for the app (pkexec can't be
  # used inside a snap) and re-applies saved limits at boot and after sleep.
  helper:
    command: bin/bhc-helper serve
    daemon: simple
    restart-condition: always
    plugs:
      - hardware-observe
      - power-control
      - network-bind # listening on the app's local socket (auto-connected)

parts:
  battery-health-center:
    # Built with an explicit cargo call because the gnome extension's
    # LD_LIBRARY_PATH (the SDK's own libc) crashes rustup; it's cleared just for
    # the Rust toolchain. pkg-config still finds GTK in the SDK.
    plugin: nil
    source: .
    build-snaps: [rustup]
    build-packages: [gettext]
    override-build: |
      env -u LD_LIBRARY_PATH /snap/bin/rustup toolchain install stable --profile minimal
      env -u LD_LIBRARY_PATH /snap/bin/rustup default stable
      # cargo runs without the SDK's LD_LIBRARY_PATH, but the SDK's pkg-config
      # needs it to start, so the build scripts call it through a small wrapper.
      sdk_pkg_config="$(command -v pkg-config)"
      printf '#!/bin/sh\nLD_LIBRARY_PATH="%s" exec "%s" "$@"\n' "$LD_LIBRARY_PATH" "$sdk_pkg_config" > /tmp/bhc-pkg-config
      chmod +x /tmp/bhc-pkg-config
      PKG_CONFIG=/tmp/bhc-pkg-config env -u LD_LIBRARY_PATH /snap/bin/cargo install --locked --path . --root "$CRAFT_PART_INSTALL"
      rm -f "$CRAFT_PART_INSTALL/.crates.toml" "$CRAFT_PART_INSTALL/.crates2.json"
      scripts/build-locale.sh "$CRAFT_PART_INSTALL/share/locale"
      install -Dm644 data/io.github.BatteryHealthCenter.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/io.github.BatteryHealthCenter.desktop"
      install -Dm644 data/io.github.BatteryHealthCenter.metainfo.xml \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/io.github.BatteryHealthCenter.metainfo.xml"
      install -Dm644 data/icons/hicolor/scalable/apps/io.github.BatteryHealthCenter.svg \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/io.github.BatteryHealthCenter.svg"
