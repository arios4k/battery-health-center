[package]
name = "battery-health-center"
version = "0.4.1"
edition = "2021"
description = "All your laptop battery information in one place, for GNOME"
license = "GPL-3.0-or-later"
authors = ["Alexis Rios-Negron"]
default-run = "battery-health-center"
repository = "https://github.com/arios4k/battery-health-center"
homepage = "https://github.com/arios4k/battery-health-center"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
libc = "0.2"

[[bin]]
name = "battery-health-center"
path = "src/main.rs"

[[bin]]
name = "bhc-helper"
path = "src/bin/bhc-helper.rs"

[profile.release]
lto = true
strip = true

# Debian/Ubuntu package: `scripts/build-locale.sh && cargo deb` (see README). Unlike the snap, this is the
# unsandboxed version: charge limits go through pkexec, and the restore service
# re-applies a saved limit at boot and after sleep.
[package.metadata.deb]
name = "battery-health-center"
maintainer = "Alexis Rios-Negron <182820807+arios4k@users.noreply.github.com>"
copyright = "2026, Alexis Rios-Negron"
license-file = ["data/deb/copyright", "0"]
changelog = "data/deb/changelog"
maintainer-scripts = "data/deb/scripts"
section = "utils"
priority = "optional"
depends = "$auto, libgtk-4-1 (>= 4.14), libadwaita-1-0 (>= 1.5), pkexec | policykit-1, upower"
recommends = "power-profiles-daemon"
extended-description = """\
Battery Health Center shows everything about your laptop battery in one \
GNOME app: health and cycle count, charge limits and profiles to reduce \
wear, a charging schedule and optimized charging, battery use during sleep, \
power modes and power-saving settings, battery-saving tips, and which apps \
use the most energy (with an hour-by-hour view per app). History can be \
exported as CSV. It is available in English, Spanish and German.
.
Charge limits need a laptop whose firmware exposes charge thresholds to the \
kernel (as on ThinkPads and many others). Changing them asks for your \
password through PolicyKit; the charging schedule is then carried out by a \
small root service without asking again."""
assets = [
    ["target/release/battery-health-center", "usr/bin/", "755"],
    ["target/release/bhc-helper", "usr/libexec/battery-health-center/", "755"],
    ["data/deb/io.github.BatteryHealthCenter.policy", "usr/share/polkit-1/actions/", "644"],
    ["data/io.github.BatteryHealthCenter.desktop", "usr/share/applications/", "644"],
    ["data/io.github.BatteryHealthCenter.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/icons/hicolor/scalable/apps/io.github.BatteryHealthCenter.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/deb/battery-health-center.1", "usr/share/man/man1/", "644"],
    # One line per language in po/ (cargo-deb flattens globs).
    ["locale/de/LC_MESSAGES/battery-health-center.mo", "usr/share/locale/de/LC_MESSAGES/", "644"],
    ["locale/es/LC_MESSAGES/battery-health-center.mo", "usr/share/locale/es/LC_MESSAGES/", "644"],
    ["README.md", "usr/share/doc/battery-health-center/", "644"],
]

[[package.metadata.deb.systemd-units]]
unit-name = "battery-health-center-restore"
unit-scripts = "data/deb"
enable = true
start = false
restart-after-upgrade = false

# Carries out the charging schedule; the .path unit starts it once a schedule exists.
[[package.metadata.deb.systemd-units]]
unit-name = "battery-health-center-scheduler"
unit-scripts = "data/deb"
enable = true
start = true
restart-after-upgrade = true
