name: CI

# Builds, tests and lints the app on every push and pull request, and checks that
# the .deb still builds and that the translation template is up to date.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config gettext
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Translations are valid and the template is up to date
        run: |
          scripts/build-locale.sh
          python3 scripts/update-pot.py
          git diff --exit-code po/battery-health-center.pot

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config gettext
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb --locked
      - name: Build the .deb
        run: |
          scripts/build-locale.sh
          cargo deb
      - name: Show what is in the package
        run: |
          dpkg-deb --info target/debian/*.deb
          dpkg-deb --contents target/debian/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/debian/*.deb
          retention-days: 14
