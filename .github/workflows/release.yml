name: Release

# Pushing a tag like v0.4.2 builds the .deb, publishes a GitHub Release with it, and
# adds the package to the signed apt repository (https://arios4k.github.io/apt, served
# from the arios4k/apt repository).
#
# The apt step needs three repository secrets and is skipped, with a notice, until they
# exist (see docs/MAINTAINING.md):
#   APT_SIGNING_KEY         the armored secret signing key
#   APT_SIGNING_PASSPHRASE  its passphrase (leave out if the key has none)
#   APT_REPO_TOKEN          a token that can push to arios4k/apt
#
# Running the workflow by hand builds the .deb and attaches it to the run, and (when the
# secrets exist) checks them by signing a copy of the apt repository without pushing.
# It publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config gettext
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "Cargo.toml says $version"
          if ! grep -q "^battery-health-center (${version}-1)" data/deb/changelog; then
            echo "::error::data/deb/changelog has no entry for ${version}-1"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Build the .deb
        run: |
          cargo install cargo-deb --locked
          scripts/build-locale.sh
          cargo deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/debian/*.deb

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/debian/*.deb --title "Battery Health Center $GITHUB_REF_NAME" --generate-notes

  apt:
    needs: build
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check that the apt secrets exist
        id: secrets
        env:
          KEY: ${{ secrets.APT_SIGNING_KEY }}
          TOKEN: ${{ secrets.APT_REPO_TOKEN }}
        run: |
          if [ -n "$KEY" ] && [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::APT_SIGNING_KEY or APT_REPO_TOKEN is not set, so the apt repository was not updated. Add them (see docs/MAINTAINING.md) and run scripts/publish-apt.sh or re-run this job."
          fi

      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v4

      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: arios4k/apt
          token: ${{ secrets.APT_REPO_TOKEN }}
          path: site

      - if: steps.secrets.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: deb
          path: debs

      - name: Add the package and sign the repository
        if: steps.secrets.outputs.present == 'true'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          sudo apt-get update && sudo apt-get install -y reprepro
          packaging/apt/publish.sh debs/*.deb site
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "Dry run: the repository was signed and verified here, and nothing was pushed."
            gpg --verify site/dists/stable/InRelease
            ls -l site/dists/stable site/pool/main/b/battery-health-center
          fi

      - name: Push to arios4k/apt
        if: steps.secrets.outputs.present == 'true' && github.ref_type == 'tag'
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "battery-health-center ${GITHUB_REF_NAME#v}-1"
          git push origin HEAD:main
